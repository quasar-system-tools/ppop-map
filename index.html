<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6547"><meta name="description" content="우리 동네 인형뽑기방을 찾고, 도전과 득템을 기록하세요."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2752%27 font-size=%2752%27%3E🧸%3C/text%3E%3C/svg%3E"><title>뽑! — 오늘의 득템은 어디?</title><link rel="stylesheet" href="leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./" aria-label="뽑 홈">뽑<span>!</span><small>동네 인형뽑기 지도</small></a><div class="header-note"><span class="live-dot"></span> 작은 도전, 커다란 행복</div><button id="my-records" class="outline">♡ 나의 뽑기노트 <span id="record-count">0</span></button></header>
<main><aside id="sidebar"><section class="intro"><span class="eyebrow">YOUR NEXT LITTLE WIN</span><h1>오늘의 득템은<br>어디에서<span>?</span></h1><p>골목마다 숨어 있는 인형뽑기방을 찾아봐요.</p></section><form id="search-form" class="search"><span>⌕</span><input id="search" aria-label="매장명 또는 지역 검색" placeholder="지역, 매장 이름으로 찾아보기" autocomplete="off"><button aria-label="검색">↵</button></form><div class="quick-regions"><button data-center="37.556,126.923">홍대</button><button data-center="37.544,127.056">성수</button><button data-center="37.499,127.027">강남</button><button data-center="35.157,129.059">부산 서면</button><button data-center="35.869,128.596">대구</button></div><div class="tabs"><button id="nearby-tab" class="active">📍 주변 가게</button><button id="saved-tab">♡ 저장한 가게</button></div><div class="list-top"><strong id="result-count">매장을 불러오는 중</strong><span id="list-context">현재 지도 기준</span></div><div id="store-list" class="store-list"><div class="empty">전국 매장 데이터를 불러오고 있어요…</div></div><footer><span class="live-dot"></span> 공공데이터 기반 · 방문 정보는 직접 확인해 주세요<br><button id="data-info">데이터 출처 및 POC 안내 ↗</button></footer></aside>
<section class="map-area" aria-label="인형뽑기방 지도"><div id="map"></div><div class="map-filters"><button id="candidate-filter" class="chip selected">🧸 인형뽑기 후보</button><button id="review-filter" class="chip">✎ 내 기록 있는 곳</button><button id="price-filter" class="chip">₩ 1,000원 이하</button><button id="machine-filter" class="chip">▣ 머신 종류</button></div><div class="map-caption"><span class="live-dot"></span><span id="national-count">전국 데이터 연결 중</span></div><button id="locate" class="map-control" aria-label="내 위치로 이동" title="내 위치">◎</button><div class="map-zoom"><button id="zoom-in" aria-label="지도 확대">＋</button><button id="zoom-out" aria-label="지도 축소">−</button></div><div class="map-bottom-note">인형뽑기 후보 · 영업 등록 기준</div><button id="report-store" class="primary report">＋ 가게 제보</button><button id="mobile-toggle" class="mobile-toggle">☰ 매장 목록</button><div id="tile-error" class="tile-error" hidden>지도 배경을 불러오지 못했어요. 매장 목록은 계속 이용할 수 있어요.</div></section></main>
<dialog id="detail-dialog" class="detail-dialog"><div id="detail-content"></div></dialog><dialog id="form-dialog"><div class="modal-heading"><h2 id="form-title"></h2><button class="close" data-close="form-dialog" aria-label="닫기">×</button></div><form id="entry-form"></form></dialog><dialog id="info-dialog"><div class="modal-heading"><h2>뽑! POC 안내</h2><button class="close" data-close="info-dialog" aria-label="닫기">×</button></div><div id="info-content"></div></dialog><div id="toast" role="status"></div>
